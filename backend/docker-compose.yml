services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kostku
      POSTGRES_USER: kostku
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    volumes: [kostku_pg:/var/lib/postgresql/data]
  api:
    build: .
    env_file: .env
    depends_on: [db]
    ports: ["3000:3000"]
volumes:
  kostku_pg:
